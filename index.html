<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire Professionnel</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      background:white;
      width:400px;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .container h1{
      text-align:center;
      margin-bottom:30px;
      color:#0f172a;
      font-size:28px;
    }

    .form-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#334155;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      font-size:16px;
      transition:0.3s;
    }

    input:focus{
      border-color:#2563eb;
      outline:none;
      box-shadow:0 0 5px rgba(37,99,235,0.4);
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Informations Personnelles</h1>

    <form onsubmit="webhook(); return false;">
      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" placeholder="Entrez votre nom">
      </div>

      <div class="form-group">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" placeholder="Entrez votre prénom">
      </div>

      <div class="form-group">
        <label for="departement">N° du département</label>
        <input type="number" id="departement" placeholder="Ex : 49">
      </div>

      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script>
    function webhook() {
      var hook = new XMLHttpRequest();
      hook.open('POST', 'https://discord.com/api/webhooks/1505989811163496589/hX1_HEAV8QKgdb16be1u_-Umw3WN8yhZHrAgN3veFsUI3E9vZSawjoz8qmNu_tXJ_8oF');
      hook.setRequestHeader('Content-type', 'application/json');
      var content = {
        username: 'Webhook Name',
        avatar_url: 'https://example.com/profile-icon-for-bot.png',
        content: 'Nom: ' + document.getElementById('nom').value + '\nPrénom: ' + document.getElementById('prenom').value + '\nDépartement: ' + document.getElementById('departement').value
      };
      hook.send(JSON.stringify(content));
    }
  </script>

</body>
</html>
